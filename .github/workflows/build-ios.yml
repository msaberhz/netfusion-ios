name: Build & Package NetFusion iOS IPA
on: [push, workflow_dispatch]
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Run Unit Tests
        run: |
          xcodebuild test -project NetFusion.xcodeproj -scheme NetFusionTests -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO
      - name: Build Unsigned App & Package IPA
        run: |
          xcodebuild build -project NetFusion.xcodeproj -scheme NetFusion -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build_out
          mkdir -p Payload
          cp -r build_out/NetFusion.app Payload/
          zip -r NetFusion-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NetFusion-IPA
          path: NetFusion-iOS.ipa
